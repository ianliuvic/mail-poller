<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>邮件追踪</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e6e8eb;--text:#1f2328;--muted:#6b7280;
        --green:#137333;--amber:#b06000;--red:#c5221f;--blue:#1a73e8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
  h1{font-size:19px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card .k{font-size:12px;color:var(--muted);margin-bottom:6px}
  .card .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .card .v.green{color:var(--green)}
  .card .v.muted{color:var(--muted)}
  .tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--line)}
  .tab{padding:8px 14px;font-size:13.5px;cursor:pointer;color:var(--muted);
       border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--text);border-bottom-color:#1f2328;font-weight:600}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  input[type=search]{flex:1;min-width:200px;padding:8px 11px;border:1px solid var(--line);
        border-radius:8px;font:inherit;background:#fff;outline:none}
  input[type=search]:focus{border-color:#c7cbd1}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:999px;
        font-size:12.5px;cursor:pointer;color:#3c4043}
  .chip.on{background:#1f2328;border-color:#1f2328;color:#fff}
  button{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:7px;
        font:inherit;cursor:pointer}
  button:hover{background:#f2f3f5}
  table{width:100%;border-collapse:collapse;background:var(--card);
        border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);
        font-size:13px;vertical-align:top}
  th{background:#fafbfc;color:var(--muted);font-weight:600;font-size:12px}
  tr.row{cursor:pointer}
  tr.row:hover{background:#fafbfc}
  tr.row.child td{background:#fff}
  tr.row.child td:first-child{padding-left:30px}
  tr.row.child .email{font-weight:500;font-size:12.5px}
  tr.group{cursor:pointer;background:#fbfcfd}
  tr.group:hover{background:#f3f5f8}
  tr.group .email{display:flex;align-items:center;gap:6px}
  tr.group .subject{color:#3c4043}
  tr.row:last-child td{border-bottom:0}
  .email{font-weight:600}
  .subject{color:#3c4043;font-size:12px;margin-top:2px;max-width:330px;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;
         border:1px solid transparent}
  .b-green{background:#e8f5ec;color:var(--green);border-color:#c6e3cf}
  .b-amber{background:#fdf1e0;color:var(--amber);border-color:#f2d9b0}
  .b-gray{background:#f1f3f4;color:var(--muted);border-color:#e3e5e8}
  .b-red{background:#fce8e6;color:var(--red);border-color:#f3c8c3}
  .b-blue{background:#e8f0fe;color:#1a73e8;border-color:#c6dafc}
  .muted{color:var(--muted)}
  .events{background:#fbfcfd}
  .events td{padding:0 12px 12px}
  .ev{display:grid;grid-template-columns:145px 125px 140px 1fr;gap:8px;
      padding:7px 0;border-top:1px dashed var(--line);font-size:12px}
  .ev:first-child{border-top:0}
  .ua{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pix{margin:8px 0 4px;font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pix code{background:#f1f3f4;padding:3px 7px;border-radius:5px;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:560px}
  .pix button{padding:3px 9px;font-size:12px}
  .actions{display:flex;gap:6px;flex-wrap:wrap}
  .actions a{font-size:12px;color:var(--blue);text-decoration:none;padding:3px 8px;
             border:1px solid var(--line);border-radius:6px;white-space:nowrap}
  .actions a:hover{background:#f2f3f5}
  .empty{padding:28px;text-align:center;color:var(--muted)}
  @media(max-width:820px){.cards{grid-template-columns:repeat(2,1fr)}
    .ev{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>📮 邮件追踪</h1>
  <div class="sub" id="sub">加载中…</div>

  <div class="cards">
    <div class="card"><div class="k">追踪邮件</div><div class="v" id="m-tracked">–</div></div>
    <div class="card"><div class="k">已打开</div><div class="v green" id="m-opened">–</div></div>
    <div class="card"><div class="k">真人打开</div><div class="v" id="m-human">–</div></div>
    <div class="card"><div class="k">客户数</div><div class="v muted" id="m-contacts">–</div></div>
  </div>

  <div class="tabs">
    <div class="tab on" data-view="email">按邮件</div>
    <div class="tab" data-view="contact">按客户</div>
    <div class="tab" data-view="followup">待跟进</div>
  </div>

  <div id="emailView">
    <div class="chips" id="chips">
      <div class="chip on" data-f="all">全部</div>
      <div class="chip" data-f="unopened">未打开</div>
      <div class="chip" data-f="opened">已打开</div>
      <div class="chip" data-f="human">真人已读</div>
    </div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索收件人或主题…">
      <button id="refresh">刷新</button>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:30%">收件人 / 主题</th>
          <th style="width:12%">状态</th>
          <th style="width:15%">首次打开</th>
          <th style="width:15%">最近打开</th>
          <th style="width:8%">真人次数</th>
          <th style="width:20%">操作</th>
        </tr>
      </thead>
      <tbody id="rows"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>

  <div id="contactView" style="display:none">
    <div class="toolbar">
      <input type="search" id="q2" placeholder="搜索客户邮箱…">
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:28%">客户</th>
          <th style="width:10%">邮件数</th>
          <th style="width:10%">已打开</th>
          <th style="width:10%">真人次数</th>
          <th style="width:18%">首次真人打开</th>
          <th style="width:24%">最近主题</th>
        </tr>
      </thead>
      <tbody id="rows2"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>

  <div id="followupView" style="display:none">
    <div class="toolbar">
      <div class="chips" style="margin:0">
        <div class="chip on" data-ff="due">该跟进 <span id="c-due">0</span></div>
        <div class="chip" data-ff="active">进行中 <span id="c-active">0</span></div>
        <div class="chip" data-ff="paused">已暂停 <span id="c-paused">0</span></div>
        <div class="chip" data-ff="closed">已结束 <span id="c-closed">0</span></div>
      </div>
      <button id="sendDigest" title="立即推送一次飞书提醒（测试用）">立即提醒</button>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:26%">客户</th>
          <th style="width:12%">状态</th>
          <th style="width:8%">已发</th>
          <th style="width:16%">最后发送</th>
          <th style="width:16%">下次提醒</th>
          <th style="width:22%">操作</th>
        </tr>
      </thead>
      <tbody id="rows3"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody>
    </table>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const ZOHO = 'https://mail.zoho.com.cn/zm/#search/';
let DATA = { rows: [], contacts: [], summary: {} };
let FILTER = 'all';
let QUERY = '';
let QUERY2 = '';
let VIEW = 'email';

function fmt(iso){
  if(!iso) return '<span class="muted">—</span>';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const p = (n)=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function ago(iso){
  if(!iso) return '';
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if(s < 60) return '刚刚';
  if(s < 3600) return Math.round(s/60)+' 分钟前';
  if(s < 86400) return Math.round(s/3600)+' 小时前';
  return Math.round(s/86400)+' 天前';
}
function esc(s){
  return String(s??'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function statusBadge(r){
  if(r.first_human_open_at) return '<span class="badge b-green">真人已读</span>';
  if(r.manual_read_at) return '<span class="badge b-blue">人工确认</span>';
  if(r.first_open_at) return '<span class="badge b-amber">仅代理/自助</span>';
  if(r.bot_count) return '<span class="badge b-red">仅扫描器</span>';
  return '<span class="badge b-gray">未打开</span>';
}
function zohoLink(r){
  const q = (r.subject && r.subject.trim()) ? r.subject.trim() : (r.recipient || '');
  return ZOHO + encodeURIComponent(q);
}
function matches(r){
  if(QUERY){
    const hay = ((r.recipient||'') + ' ' + (r.subject||'')).toLowerCase();
    if(!hay.includes(QUERY)) return false;
  }
  if(FILTER==='unopened') return !r.first_open_at && !r.manual_read_at;
  if(FILTER==='opened') return !!(r.first_open_at || r.manual_read_at);
  if(FILTER==='human') return !!(r.first_human_open_at || r.manual_read_at);
  return true;
}
function threadKeyOf(r){
  return r.thread_key || ((r.recipient||'') + '|' + (r.subject||''));
}
function buildGroups(rows){
  const map = new Map();
  rows.forEach(r=>{
    const k = threadKeyOf(r);
    if(!map.has(k)) map.set(k, []);
    map.get(k).push(r);
  });
  const groups = [];
  for(const [k, items] of map){
    items.sort((a,b)=> String(b.created_at||'').localeCompare(String(a.created_at||'')));
    const latest = items[0];
    const firstHuman = items
      .flatMap(x=>[x.first_human_open_at, x.manual_read_at])
      .filter(Boolean).sort()[0] || null;
    const lastOpen = items.map(x=>x.last_open_at).filter(Boolean).sort().pop() || null;
    groups.push({
      key:k, items, recipient: latest.recipient, subject: latest.subject,
      rootSubject: (items[items.length-1].subject || latest.subject || ''),
      count: items.length,
      human: items.reduce((s,x)=>s+(x.human_open_count||0)+(x.manual_read_at?1:0),0),
      opened: items.some(x=>x.first_open_at || x.manual_read_at),
      humanOpened: items.some(x=>x.first_human_open_at || x.manual_read_at),
      firstHuman, lastOpen,
      sortKey: lastOpen || latest.created_at || ''
    });
  }
  groups.sort((a,b)=> String(b.sortKey).localeCompare(String(a.sortKey)));
  return groups;
}
function emailRowHtml(r, uid, child, gi){
  const pix = location.origin + '/t/' + r.token + '.gif';
  const childAttr = child ? ` data-g="${gi}" style="display:none"` : '';
  return `
  <tr class="row${child?' child':''}" data-i="${uid}"${childAttr}>
    <td>
      <div class="email">${esc(r.recipient || r.token)}</div>
      ${r.subject ? `<div class="subject" title="${esc(r.subject)}">${esc(r.subject)}</div>` : ''}
    </td>
    <td>${statusBadge(r)}</td>
    <td>${fmt(r.first_human_open_at || r.first_open_at)}</td>
    <td>${fmt(r.last_open_at)} <span class="muted" style="font-size:11px">${ago(r.last_open_at)}</span></td>
    <td title="总命中 ${r.open_count || 0} 次">${r.human_open_count || 0}</td>
    <td>
      <div class="actions">
        <a href="${zohoLink(r)}" target="_blank" rel="noopener">在 Zoho 中查看</a>
        <button data-copy="${esc(pix)}">复制像素</button>
        <button data-mark="${esc(r.token)}" data-clear="${r.manual_read_at ? 1 : 0}">${r.manual_read_at ? '取消人工标记' : '标记已读'}</button>
      </div>
    </td>
  </tr>
  <tr class="events" id="ev-${uid}" style="display:none"><td colspan="6">
    <div class="pix"><span class="muted">像素</span><code title="${esc(pix)}">${esc(pix)}</code></div>
    ${(r.events||[]).map(e=>`
      <div class="ev">
        <div>${fmt(e.at)}</div>
        <div>${esc(e.client_type||'')}</div>
        <div>${esc(e.ip||'')}</div>
        <div class="ua" title="${esc(e.ua||'')}">${esc(e.ua||'')}${e.is_self?' · 自己':''}${e.is_bot?' · 机器人':''}${e.is_direct?' · 直接访问':''}</div>
      </div>`).join('') || '<div class="muted" style="padding:6px 0">还没有任何打开记录</div>'}
  </td></tr>`;
}
function groupHeaderHtml(g, gi){
  const latest = g.items[0];
  const badge = g.humanOpened
    ? '<span class="badge b-green">真人已读</span>'
    : g.opened
    ? '<span class="badge b-amber">仅代理/自助</span>'
    : '<span class="badge b-gray">未打开</span>';
  return `
  <tr class="group" data-gi="${gi}">
    <td>
      <div class="email">${esc(g.recipient || latest.token)}
        <span class="badge b-gray">${g.count} 封</span></div>
      <div class="subject" title="${esc(g.rootSubject || '')}">${esc(g.rootSubject || '—')}</div>
    </td>
    <td>${badge}</td>
    <td>${fmt(g.firstHuman)}</td>
    <td>${fmt(g.lastOpen)} <span class="muted" style="font-size:11px">${ago(g.lastOpen)}</span></td>
    <td>${g.human}</td>
    <td>
      <div class="actions">
        <button data-toggle="${gi}">展开 ${g.count} 封</button>
        <a href="${zohoLink(latest)}" target="_blank" rel="noopener">在 Zoho 中查看</a>
        <button data-mark="${esc(latest.token)}" data-clear="${latest.manual_read_at ? 1 : 0}">${latest.manual_read_at ? '取消人工标记' : '标记最新一封已读'}</button>
      </div>
    </td>
  </tr>`;
}
function renderEmails(){
  const rows = DATA.rows.filter(matches);
  if(!rows.length){
    $('rows').innerHTML = '<tr><td colspan="6" class="empty">没有符合条件的邮件</td></tr>';
    return;
  }
  const groups = buildGroups(rows);
  let html = '';
  let uid = 0;
  groups.forEach((g, gi)=>{
    if(g.items.length === 1){
      html += emailRowHtml(g.items[0], uid++, false, gi);
      return;
    }
    html += groupHeaderHtml(g, gi);
    g.items.forEach(r=>{ html += emailRowHtml(r, uid++, true, gi); });
  });
  $('rows').innerHTML = html;

  document.querySelectorAll('tr.row').forEach(tr=>{
    tr.addEventListener('click',(e)=>{
      if(e.target.closest('.actions')) return;
      const ev = document.getElementById('ev-'+tr.dataset.i);
      if(ev) ev.style.display = ev.style.display === 'none' ? '' : 'none';
    });
  });
  document.querySelectorAll('tr.group').forEach(tr=>{
    const gi = tr.dataset.gi;
    const btn = tr.querySelector('[data-toggle]');
    tr.addEventListener('click',(e)=>{
      if(e.target.closest('a')) return;
      const kids = [...document.querySelectorAll(`tr.child[data-g="${gi}"]`)];
      if(!kids.length) return;
      const open = kids[0].style.display === 'none';
      kids.forEach(k=>{
        k.style.display = open ? '' : 'none';
        const ev = document.getElementById('ev-'+k.dataset.i);
        if(ev) ev.style.display = 'none';
      });
      if(btn) btn.textContent = open ? '收起' : `展开 ${kids.length} 封`;
    });
  });
  document.querySelectorAll('button[data-copy]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      try{
        await navigator.clipboard.writeText(btn.dataset.copy);
        const old = btn.textContent;
        btn.textContent = '已复制';
        setTimeout(()=>{ btn.textContent = old; }, 1500);
      }catch(err){ btn.textContent = '复制失败'; }
    });
  });
  document.querySelectorAll('button[data-mark]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const clear = btn.dataset.clear === '1';
      btn.disabled = true;
      btn.textContent = '处理中…';
      try{
        const res = await fetch('/api/tracking/mark', {
          method:'POST',
          credentials:'same-origin',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({token: btn.dataset.mark, clear})
        });
        if(res.ok){ await load(); }
        else { btn.disabled = false; btn.textContent = '操作失败'; }
      }catch(err){
        btn.disabled = false;
        btn.textContent = '操作失败';
      }
    });
  });
}
function renderContacts(){
  const rows = DATA.contacts.filter(c=>!QUERY2 || (c.recipient||'').toLowerCase().includes(QUERY2));
  if(!rows.length){
    $('rows2').innerHTML = '<tr><td colspan="6" class="empty">没有客户记录</td></tr>';
    return;
  }
  $('rows2').innerHTML = rows.map((c,i)=>`
    <tr class="row" data-c="${i}">
      <td><div class="email">${esc(c.recipient)}</div></td>
      <td>${c.emails}</td>
      <td>${c.opened}</td>
      <td>${c.human_opens}</td>
      <td>${fmt(c.first_human_open_at)}</td>
      <td class="subject" title="${esc(c.last_subject||'')}">${esc(c.last_subject||'—')}</td>
    </tr>`).join('');

  document.querySelectorAll('#rows2 tr.row').forEach(tr=>{
    tr.addEventListener('click',()=>{
      const c = rows[tr.dataset.c];
      QUERY = (c.recipient||'').toLowerCase();
      $('q').value = QUERY;
      switchView('email');
      renderEmails();
    });
  });
}
let FU = { items: [], summary: {} };
let FF = 'due';

function fuBadge(it){
  if(it.status === 'replied') return '<span class="badge b-green">已回复</span>';
  if(it.status === 'given_up') return '<span class="badge b-gray">已放弃</span>';
  if(it.status === 'paused') return '<span class="badge b-amber">已暂停</span>';
  const due = it.next_due_at && it.next_due_at <= new Date().toISOString();
  return due ? '<span class="badge b-red">该跟进</span>' : '<span class="badge b-gray">等待中</span>';
}
function renderFollowups(){
  const s = FU.summary || {};
  const nowIso = new Date().toISOString();
  $('c-due').textContent = s.due || 0;
  $('c-active').textContent = s.active || 0;
  $('c-paused').textContent = s.paused || 0;
  $('c-closed').textContent = (s.replied || 0) + (s.given_up || 0);

  const items = (FU.items || []).filter(it=>{
    if(FF === 'due') return it.status === 'active' && it.next_due_at && it.next_due_at <= nowIso;
    if(FF === 'active') return it.status === 'active';
    if(FF === 'paused') return it.status === 'paused';
    return it.status === 'replied' || it.status === 'given_up';
  });
  if(!items.length){
    $('rows3').innerHTML = '<tr><td colspan="6" class="empty">没有符合条件的客户</td></tr>';
    return;
  }
  $('rows3').innerHTML = items.map((it,i)=>`
    <tr class="row" data-f="${i}">
      <td>
        <div class="email">${esc(it.recipient)}</div>
        ${it.last_subject ? `<div class="subject" title="${esc(it.last_subject)}">${esc(it.last_subject)}</div>` : ''}
        ${it.overdue_days ? `<div class="muted" style="font-size:11px">逾期 ${it.overdue_days} 天</div>` : ''}
      </td>
      <td>${fuBadge(it)}</td>
      <td>${it.attempts || 0}</td>
      <td>${fmt(it.last_outbound_at)}<div class="muted" style="font-size:11px">${it.days_since_last != null ? it.days_since_last + ' 天前' : ''}</div></td>
      <td>${it.status === 'active' ? fmt(it.next_due_at) : '<span class="muted">—</span>'}</td>
      <td>
        <div class="actions">
          <button data-fu="snooze" data-r="${esc(it.recipient)}">已跟进</button>
          ${it.status === 'paused'
            ? `<button data-fu="resume" data-r="${esc(it.recipient)}">恢复</button>`
            : `<button data-fu="pause" data-r="${esc(it.recipient)}">暂停</button>`}
          <button data-fu="replied" data-r="${esc(it.recipient)}">已回复</button>
          <button data-fu="give_up" data-r="${esc(it.recipient)}">放弃</button>
        </div>
      </td>
    </tr>`).join('');

  document.querySelectorAll('button[data-fu]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      const recipient = btn.dataset.r;
      const action = btn.dataset.fu;
      btn.disabled = true;
      try{
        const res = await fetch('/api/followups/action', {
          method:'POST', credentials:'same-origin',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({recipient, action})
        });
        if(res.ok){ await loadFollowups(); }
        else { btn.disabled = false; btn.textContent = '失败'; }
      }catch(err){ btn.disabled = false; }
    });
  });
}
async function loadFollowups(){
  $('rows3').innerHTML = '<tr><td colspan="6" class="empty">加载中…</td></tr>';
  try{
    const res = await fetch('/api/followups', {credentials:'same-origin'});
    if(res.status === 401){ location.href = '/tracking'; return; }
    FU = await res.json();
    renderFollowups();
  }catch(err){
    $('rows3').innerHTML = '<tr><td colspan="6" class="empty">加载失败：' + esc(err.message) + '</td></tr>';
  }
}
function switchView(v){
  VIEW = v;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on', t.dataset.view===v));
  $('emailView').style.display = v==='email' ? '' : 'none';
  $('contactView').style.display = v==='contact' ? '' : 'none';
  $('followupView').style.display = v==='followup' ? '' : 'none';
  if(v==='email') renderEmails();
  else if(v==='contact') renderContacts();
  else loadFollowups();
}
async function load(){
  $('sub').textContent = '加载中…';
  try{
    const res = await fetch('/api/tracking', {credentials:'same-origin'});
    if(res.status === 401){ location.href = '/tracking'; return; }
    DATA = await res.json();
    const s = DATA.summary;
    $('m-tracked').textContent  = s.tracked;
    $('m-opened').textContent   = s.opened;
    $('m-human').textContent    = s.human_opened;
    $('m-contacts').textContent = s.contacts;
    $('sub').textContent = `更新于 ${fmt(DATA.generated_at)} · 今日事件 ${s.events_today} · 点击行展开明细`;
    switchView(VIEW);
  }catch(err){
    $('sub').textContent = '加载失败：' + err.message;
  }
}
$('q').addEventListener('input', (e)=>{ QUERY = e.target.value.trim().toLowerCase(); renderEmails(); });
$('q2').addEventListener('input', (e)=>{ QUERY2 = e.target.value.trim().toLowerCase(); renderContacts(); });
$('refresh').addEventListener('click', load);
document.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    FILTER = c.dataset.f;
    renderEmails();
  });
});
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>switchView(t.dataset.view));
});
document.querySelectorAll('.chip[data-ff]').forEach(c=>{
  c.addEventListener('click', ()=>{
    document.querySelectorAll('.chip[data-ff]').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    FF = c.dataset.ff;
    renderFollowups();
  });
});
const digestBtn = $('sendDigest');
if(digestBtn){
  digestBtn.addEventListener('click', async ()=>{
    digestBtn.disabled = true;
    try{
      const res = await fetch('/api/followups/digest', {method:'POST', credentials:'same-origin'});
      const j = await res.json().catch(()=>({}));
      alert('已推送 ' + (j.due ?? 0) + ' 个客户的提醒');
      await loadFollowups();
    }catch(err){
      alert('推送失败：' + err.message);
    }
    digestBtn.disabled = false;
  });
}
load();
</script>
</body>
</html>
