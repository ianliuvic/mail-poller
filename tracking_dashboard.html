<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>全部追踪像素</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--line:#e6e8eb;--text:#1f2328;--muted:#6b7280;
        --green:#137333;--amber:#b06000;--red:#c5221f;--blue:#1a73e8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Arial,sans-serif}
  .wrap{max-width:1140px;margin:0 auto;padding:24px 20px 60px}
  h1{font-size:19px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:18px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card .k{font-size:12px;color:var(--muted);margin-bottom:6px}
  .card .v{font-size:24px;font-weight:700;letter-spacing:-.02em}
  .card .v.green{color:var(--green)}
  .card .v.muted{color:var(--muted)}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  input[type=search]{flex:1;min-width:200px;padding:8px 11px;border:1px solid var(--line);
        border-radius:8px;font:inherit;background:#fff;outline:none}
  input[type=search]:focus{border-color:#c7cbd1}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{padding:5px 11px;border:1px solid var(--line);background:#fff;border-radius:999px;
        font-size:12.5px;cursor:pointer;color:#3c4043}
  .chip.on{background:#1f2328;border-color:#1f2328;color:#fff}
  button{padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:8px;
        font:inherit;cursor:pointer}
  button:hover{background:#f2f3f5}
  table{width:100%;border-collapse:collapse;background:var(--card);
        border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);
        font-size:13px;vertical-align:top}
  th{background:#fafbfc;color:var(--muted);font-weight:600;font-size:12px}
  tr.row{cursor:pointer}
  tr.row:hover{background:#fafbfc}
  tr.row:last-child td{border-bottom:0}
  .email{font-weight:600}
  .subject{color:var(--muted);font-size:12px;margin-top:2px;max-width:340px;
           overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;
         border:1px solid transparent}
  .b-green{background:#e8f5ec;color:var(--green);border-color:#c6e3cf}
  .b-amber{background:#fdf1e0;color:var(--amber);border-color:#f2d9b0}
  .b-gray{background:#f1f3f4;color:var(--muted);border-color:#e3e5e8}
  .b-red{background:#fce8e6;color:var(--red);border-color:#f3c8c3}
  .muted{color:var(--muted)}
  .events{background:#fbfcfd}
  .events td{padding:0 12px 12px}
  .ev{display:grid;grid-template-columns:145px 125px 140px 1fr;gap:8px;
      padding:7px 0;border-top:1px dashed var(--line);font-size:12px}
  .ev:first-child{border-top:0}
  .ev-time{color:#3c4043}
  .ua{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pix{margin:8px 0 4px;font-size:12px;display:flex;gap:8px;align-items:center}
  .pix code{background:#f1f3f4;padding:3px 7px;border-radius:5px;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:640px}
  .pix button{padding:3px 9px;font-size:12px}
  .empty{padding:28px;text-align:center;color:var(--muted)}
  @media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}
    .ev{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>📮 全部追踪像素</h1>
  <div class="sub" id="sub">加载中…</div>

  <div class="cards">
    <div class="card"><div class="k">全部像素</div><div class="v" id="m-tracked">–</div></div>
    <div class="card"><div class="k">已打开</div><div class="v green" id="m-opened">–</div></div>
    <div class="card"><div class="k">真人打开</div><div class="v" id="m-human">–</div></div>
    <div class="card"><div class="k">未打开</div><div class="v muted" id="m-unopened">–</div></div>
  </div>

  <div class="chips" id="chips">
    <div class="chip on" data-f="all">全部</div>
    <div class="chip" data-f="unopened">未打开</div>
    <div class="chip" data-f="opened">已打开</div>
    <div class="chip" data-f="human">真人已读</div>
    <div class="chip" data-f="proxy">含代理预取</div>
    <div class="chip" data-f="self">含自己打开</div>
  </div>

  <div class="toolbar">
    <input type="search" id="q" placeholder="搜索收件人或主题…">
    <button id="refresh">刷新</button>
  </div>

  <table>
    <thead>
      <tr>
        <th style="width:30%">收件人 / 主题</th>
        <th style="width:12%">状态</th>
        <th style="width:16%">首次打开</th>
        <th style="width:16%">最近打开</th>
        <th style="width:8%">次数</th>
        <th style="width:18%">客户端</th>
      </tr>
    </thead>
    <tbody id="rows"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody>
  </table>
</div>

<script>
const $ = (id) => document.getElementById(id);
let DATA = { rows: [], summary: {} };
let FILTER = 'all';
let QUERY = '';

function fmt(iso){
  if(!iso) return '<span class="muted">—</span>';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  const p = (n)=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function ago(iso){
  if(!iso) return '';
  const s = (Date.now() - new Date(iso).getTime())/1000;
  if(s < 60) return '刚刚';
  if(s < 3600) return Math.round(s/60)+' 分钟前';
  if(s < 86400) return Math.round(s/3600)+' 小时前';
  return Math.round(s/86400)+' 天前';
}
function esc(s){
  return String(s??'').replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function statusBadge(r){
  if(r.first_human_open_at) return '<span class="badge b-green">真人已读</span>';
  if(r.first_open_at) return '<span class="badge b-amber">仅代理/自助</span>';
  if(r.bot_count) return '<span class="badge b-red">仅扫描器</span>';
  return '<span class="badge b-gray">未打开</span>';
}
function matches(r){
  if(QUERY){
    const hay = ((r.recipient||'') + ' ' + (r.subject||'')).toLowerCase();
    if(!hay.includes(QUERY)) return false;
  }
  if(FILTER==='unopened') return !r.first_open_at;
  if(FILTER==='opened') return !!r.first_open_at;
  if(FILTER==='human') return !!r.first_human_open_at;
  if(FILTER==='proxy') return (r.proxy_open_count||0) > 0;
  if(FILTER==='self') return (r.self_open_count||0) > 0;
  return true;
}
function render(){
  const rows = DATA.rows.filter(matches);
  if(!rows.length){
    $('rows').innerHTML = '<tr><td colspan="6" class="empty">没有符合条件的像素</td></tr>';
    return;
  }
  $('rows').innerHTML = rows.map((r,i)=>{
    const pix = location.origin + '/t/' + r.token + '.gif';
    return `
    <tr class="row" data-i="${i}">
      <td>
        <div class="email">${esc(r.recipient || r.token)}</div>
        ${r.subject ? `<div class="subject" title="${esc(r.subject)}">${esc(r.subject)}</div>` : ''}
      </td>
      <td>${statusBadge(r)}</td>
      <td>${fmt(r.first_human_open_at || r.first_open_at)}</td>
      <td>${fmt(r.last_open_at)} <span class="muted" style="font-size:11px">${ago(r.last_open_at)}</span></td>
      <td>${r.open_count || 0}</td>
      <td>${esc(r.last_client_type || '—')}</td>
    </tr>
    <tr class="events" id="ev-${i}" style="display:none"><td colspan="6">
      <div class="pix">
        <span class="muted">像素</span>
        <code title="${esc(pix)}">${esc(pix)}</code>
        <button data-copy="${esc(pix)}">复制</button>
      </div>
      ${(r.events||[]).map(e=>`
        <div class="ev">
          <div class="ev-time">${fmt(e.at)}</div>
          <div>${esc(e.client_type||'')}</div>
          <div>${esc(e.ip||'')}</div>
          <div class="ua" title="${esc(e.ua||'')}">${esc(e.ua||'')}${e.is_self?' · 自己':''}${e.is_bot?' · 机器人':''}${e.is_direct?' · 直接访问':''}</div>
        </div>`).join('') || '<div class="muted" style="padding:6px 0">还没有任何打开记录</div>'}
    </td></tr>`;
  }).join('');

  document.querySelectorAll('tr.row').forEach(tr=>{
    tr.addEventListener('click',()=>{
      const ev = document.getElementById('ev-'+tr.dataset.i);
      ev.style.display = ev.style.display === 'none' ? '' : 'none';
    });
  });
  document.querySelectorAll('button[data-copy]').forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      try{
        await navigator.clipboard.writeText(btn.dataset.copy);
        btn.textContent = '已复制';
        setTimeout(()=>{ btn.textContent = '复制'; }, 1500);
      }catch(err){ btn.textContent = '复制失败'; }
    });
  });
}
async function load(){
  $('sub').textContent = '加载中…';
  try{
    const res = await fetch('/api/tracking', {credentials:'same-origin'});
    if(res.status === 401){ location.href = '/tracking'; return; }
    DATA = await res.json();
    const s = DATA.summary;
    $('m-tracked').textContent  = s.tracked;
    $('m-opened').textContent   = s.opened;
    $('m-human').textContent    = s.human_opened;
    $('m-unopened').textContent = s.unopened;
    $('sub').textContent = `更新于 ${fmt(DATA.generated_at)} · 今日事件 ${s.events_today} · 点击任意一行查看明细`;
    render();
  }catch(err){
    $('sub').textContent = '加载失败：' + err.message;
  }
}
$('q').addEventListener('input', (e)=>{ QUERY = e.target.value.trim().toLowerCase(); render(); });
$('refresh').addEventListener('click', load);
document.querySelectorAll('.chip').forEach(c=>{
  c.addEventListener('click', ()=>{
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    FILTER = c.dataset.f;
    render();
  });
});
load();
</script>
</body>
</html>
